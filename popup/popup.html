<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Yousub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <h1>Yousub</h1>
    <label class="switch" title="Enable or disable the extension" aria-label="Enable or disable the extension">
      <input type="checkbox" id="enabled" aria-label="Enable or disable the extension">
      <span></span>
    </label>
  </header>

  <!-- Summary -->
  <section class="card">
    <div class="stat">
      <div><b id="total">–</b><small>subscribed channels</small></div>
    </div>
    <em id="status" class="muted" aria-live="polite">–</em>
    <div id="channelPage" class="chan hidden"></div>
    <div id="error" class="err hidden" role="alert"></div>
  </section>

  <!-- Unsubscribe history row -->
  <section class="card drive">
    <span class="dotl"></span>
    <div class="grow">
      <div><b id="unsubCount">0</b> previously unsubscribed channels</div>
      <small id="driveStatus" class="muted" aria-live="polite">Unsubscribe history is kept only while Google Drive sync is configured</small>
    </div>
  </section>

  <!-- Drive setup: label, configuration status, and the manifest picker -->
  <section class="card drive">
    <div class="grow">
      <div>Google Drive sync</div>
      <small id="driveConfig" class="muted" aria-live="polite">❌ Not configured</small>
    </div>
    <button id="driveSetupBtn" class="icon" title="Open Drive file setup" aria-label="Open Drive file setup">📁</button>
  </section>

  <!-- Collapsible settings -->
  <details class="card">
    <summary>⚙️ Settings</summary>
    <label class="field">
      <span>Display mode</span>
      <select id="mode">
        <option value="highlight">Colored outline + subscribe button (recommended)</option>
        <option value="badge">Subscribe button only</option>
        <option value="dim">Dim subscribed channels</option>
        <option value="only-unsub">Show unsubscribed channels only</option>
        <option value="hide-unsub">Hide unsubscribed channels</option>
      </select>
    </label>
    <div class="field inline">
      <span>Colors</span>
      <span class="colors">
        <label title="Not subscribed"><input type="color" id="color" aria-label="Not subscribed color"> not subscribed</label>
        <label title="Previously unsubscribed"><input type="color" id="leftColor" aria-label="Previously unsubscribed color"> previously left</label>
      </span>
    </div>
    <label class="field inline"><span>Subscribe <b class="plus">+</b> / unsubscribe <b class="plus minus">−</b> buttons on videos, right of YouTube's button</span><input type="checkbox" id="showSubButton"></label>
    <label class="field inline"><span>Unsubscribed channels first &amp; hide duplicate videos</span><input type="checkbox" id="sortUnsub"></label>
    <label class="field inline">
      <span>Automatically load videos for sorting</span>
      <select id="autoloadLimit">
        <option value="0">Off</option><option value="100">Up to 100</option>
        <option value="250">Up to 250</option><option value="500">Up to 500</option>
      </select>
    </label>
    <div class="links">
      <a id="exportBtn" href="#">⬇️ Export list (CSV)</a>
      <a id="openFeedBtn" href="#">📋 View on YouTube</a>
    </div>
  </details>

  <footer>Version <span id="ver"></span></footer>
  <script src="../shared.js"></script>
  <script src="../drive.js"></script>
  <script src="../config-manifest.js"></script>
  <script src="popup.js"></script>
</body>
</html>
