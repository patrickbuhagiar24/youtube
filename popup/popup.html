<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Yousub</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <h1>Yousub</h1>
    <label class="switch" title="Enable Yousub" aria-label="Enable Yousub">
      <input type="checkbox" id="enabled" aria-label="Enable Yousub">
      <span></span>
    </label>
  </header>

  <!-- Summary -->
  <section class="card">
    <div class="stat">
      <div><b id="total">–</b><small>subscribed</small></div>
    </div>
    <div id="channelPage" class="chan hidden"></div>
    <div id="error" class="err hidden" role="alert"></div>
  </section>

  <!-- Unsubscribe history: count, status, and the configuration-file button -->
  <section class="card drive">
    <span class="dotl" aria-hidden="true"></span>
    <div class="grow">
      <div class="line">
        <span><b id="unsubCount">0</b> unsubscribed</span>
        <button id="driveSetupBtn" class="secondary icon" title="Choose the configuration file" aria-label="Choose the configuration file">📁</button>
      </div>
      <small id="driveStatus" class="muted" aria-live="polite">Needs Google Drive sync</small>
      <small id="setupStatus" class="muted" aria-live="polite"></small>
    </div>
  </section>

  <!-- Collapsible settings -->
  <details class="card">
    <summary>⚙️ Settings</summary>
    <label class="field">
      <span>Display mode</span>
      <select id="mode">
        <option value="highlight">Outline + button (recommended)</option>
        <option value="badge">Button only</option>
        <option value="dim">Dim subscribed</option>
        <option value="only-unsub">Unsubscribed only</option>
        <option value="hide-unsub">Hide unsubscribed</option>
      </select>
    </label>
    <div class="field inline">
      <span>Colors</span>
      <span class="colors">
        <label title="Not subscribed"><input type="color" id="color" aria-label="Unsubscribed color"> unsubscribed</label>
        <label title="Previously unsubscribed"><input type="color" id="leftColor" aria-label="History color"> history</label>
      </span>
    </div>
    <label class="field inline"><span><span class="pair"><b class="plus">+</b><span class="sep">/</span><b class="plus minus">−</b></span> buttons next to YouTube's</span><input type="checkbox" id="showSubButton"></label>
    <label class="field inline"><span>Unsubscribed first &amp; hide duplicates</span><input type="checkbox" id="sortUnsub"></label>
    <label class="field inline">
      <span>Auto-load for sorting</span>
      <select id="autoloadLimit">
        <option value="0">Off</option><option value="100">100</option>
        <option value="250">250</option><option value="500">500</option>
      </select>
    </label>
    <div class="links">
      <a id="exportBtn" href="#">⬇️ Export CSV</a>
      <a id="openFeedBtn" href="#">📋 YouTube</a>
    </div>
  </details>

  <footer>Version <span id="ver"></span></footer>
  <script src="../shared.js"></script>
  <script src="../drive.js"></script>
  <script src="../config-file.js"></script>
  <script src="popup.js"></script>
</body>
</html>
