<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YOUSUB Drive setup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="setup">
  <header>
    <img src="icons/icon48.png" alt="" width="28" height="28">
    <h1>YOUSUB Drive setup</h1>
  </header>
  <section class="card">
    <p class="hint">Choose the folder containing your YOUSUB configuration files. They are read here in the browser and saved only in this Chrome profile.</p>
    <button id="folderBtn">📂 Choose configuration folder</button>
    <small id="folderStatus" class="muted" aria-live="polite"></small>
    <small id="fileStatus" class="muted" aria-live="polite"></small>
    <div id="driveFormError" class="err hidden" role="alert"></div>
    <button id="setupClearBtn" class="secondary hidden">Remove saved configuration</button>
  </section>
  <footer>Version <span id="ver"></span></footer>
  <script src="shared.js"></script>
  <script src="config-store.js"></script>
  <script src="drive.js"></script>
  <script src="setup.js"></script>
</body>
</html>
