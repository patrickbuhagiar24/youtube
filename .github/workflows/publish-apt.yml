name: Publish signed APT repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git nodejs python3 openssl build-essential dpkg-dev make gzip xz-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-deb
          path: dist
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gnupg gpgv
      - name: Generate archive metadata
        run: bash scripts/build-apt-repository.sh dist site stonking
      - name: Import repository GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GNUPGHOME: ${{ runner.temp }}/ytuc-apt-gnupg
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY" || { echo 'Configure the GPG_PRIVATE_KEY repository secret first.'; exit 1; }
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # In colon output, field 5 is the key ID; the following fpr record holds the full fingerprint.
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '
            $1 == "sec" { primaries++; want_fpr = 1; next }
            want_fpr && $1 == "fpr" { print $10; want_fpr = 0 }
            END { if (primaries != 1) exit 2 }
          ') || { echo 'GPG_PRIVATE_KEY must contain exactly one primary key identity.'; exit 1; }
          [[ "$fingerprint" =~ ^[A-Fa-f0-9]{40}$ ]] || { echo 'Could not determine a valid GPG fingerprint.'; exit 1; }
          gpg --batch --with-colons --list-secret-keys "$fingerprint" \
            | awk -F: '($1 == "sec" || $1 == "ssb") && tolower($12) ~ /s/ { found = 1 } END { exit !found }' \
            || { echo 'The imported GPG key has no secret signing capability.'; exit 1; }
          printf 'APT_SIGNING_KEY_ID=%s\n' "$fingerprint" >> "$GITHUB_ENV"
      - name: Sign and verify archive
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GNUPGHOME: ${{ runner.temp }}/ytuc-apt-gnupg
        run: bash scripts/sign-apt-repository.sh site stonking
      - name: Remove temporary GPG keyring
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/ytuc-apt-gnupg
        run: |
          if [ -d "$GNUPGHOME" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
