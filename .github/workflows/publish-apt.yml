name: Publish signed APT repository

# Published on merge to main (and on demand). There are no release tags: the version
# comes from manifest.json, and this run builds the signed package itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # A called workflow does not inherit the caller's secrets implicitly.
    uses: ./.github/workflows/build-extension.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev gnupg gpgv

      - name: Download the signed package from this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "${{ github.run_id }}" --name yousub-extension --dir release
          test -n "$(find release -name 'yousub_*.deb' -print -quit)"
          (cd release && sha256sum -c checksums.txt)

      - name: Check whether this version is already published
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('release/manifest.json'))['version'])" 2>/dev/null || true)
          if [ -z "$version" ]; then
            # The manifest is only in the ZIP; read it from there.
            version=$(unzip -p "$(find release -name 'yousub-*-unpacked.zip' -print -quit)" manifest.json |
              python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          fi
          if [ -z "$version" ]; then echo 'No version in manifest.json.' >&2; exit 1; fi
          published=$(curl -fsSL --max-time 20 https://patrickbuhagiar24.github.io/youtube/dists/stable/main/binary-all/Packages 2>/dev/null |
            awk -v want="$version" '/^Package: yousub$/ {inpkg=1} inpkg && /^Version: / {print $2; exit}' || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$version" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip an unchanged version
        if: steps.version.outputs.already == 'true'
        run: echo "yousub ${{ steps.version.outputs.version }} is already published; nothing to deploy."

      - name: Build repository metadata
        if: steps.version.outputs.already != 'true'
        run: |
          set -euo pipefail
          mkdir -p site/pool/main/y/yousub site/dists/stable/main/binary-all site/dists/stonking/main/binary-all
          cp release/yousub-id.txt site/extension-id.txt
          cp release/yousub_*.deb site/pool/main/y/yousub/
          cd site
          dpkg-scanpackages --arch all pool /dev/null > dists/stable/main/binary-all/Packages
          gzip -9 -n -c dists/stable/main/binary-all/Packages > dists/stable/main/binary-all/Packages.gz
          cp dists/stable/main/binary-all/Packages dists/stonking/main/binary-all/Packages
          cp dists/stable/main/binary-all/Packages.gz dists/stonking/main/binary-all/Packages.gz
          cat > yousub.sources <<'EOF'
          Types: deb
          URIs: https://patrickbuhagiar24.github.io/youtube/
          Suites: stable
          Components: main
          Architectures: all
          Signed-By: /etc/apt/keyrings/yousub.gpg
          EOF
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>Yousub APT repository</title></head>
          <body>
            <h1>Yousub APT repository</h1>
            <p>Install with <code>sudo apt install yousub</code> after adding
              <code>yousub.sources</code> and the verified archive key. See the
              <a href="https://github.com/patrickbuhagiar24/youtube">installation instructions</a>.</p>
            <p>Always verify the 40-character key fingerprint through an independent channel before installing.</p>
          </body>
          </html>
          EOF
          python3 - <<'PY'
          import gzip
          import hashlib
          from datetime import datetime, timezone
          from email.utils import format_datetime
          from pathlib import Path

          for suite in ('stable', 'stonking'):
              root = Path('dists') / suite
              files = sorted(p for p in root.rglob('*') if p.is_file())
              if not files:
                  raise SystemExit('No package indices were generated.')
              fields = [
                  'Origin: Yousub',
                  'Label: Yousub',
                  f'Suite: {suite}',
                  f'Codename: {suite}',
                  'Date: ' + format_datetime(datetime.now(timezone.utc), usegmt=True),
                  'Architectures: all',
                  'Components: main',
                  'Description: Signed Yousub Chrome extension packages',
                  'Acquire-By-Hash: no',
              ]
              for label, algorithm in (('MD5Sum', 'md5'), ('SHA1', 'sha1'), ('SHA256', 'sha256'), ('SHA512', 'sha512')):
                  fields.append(label + ':')
                  for path in files:
                      data = path.read_bytes()
                      digest = hashlib.new(algorithm, data).hexdigest()
                      fields.append(f' {digest} {len(data):16d} {path.relative_to(root).as_posix()}')
              (root / 'Release').write_text('\n'.join(fields) + '\n', encoding='utf-8')
          PY

      - name: Sign the repository
        if: steps.version.outputs.already != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GNUPGHOME: ${{ runner.temp }}/yousub-apt-gnupg
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY" || { echo 'Configure the GPG_PRIVATE_KEY repository secret first.' >&2; exit 1; }
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '
            $1 == "sec" { primaries++; want_fpr = 1; next }
            want_fpr && $1 == "fpr" { print $10; want_fpr = 0 }
            END { if (primaries != 1) exit 2 }
          ') || { echo 'GPG_PRIVATE_KEY must contain exactly one primary key identity.' >&2; exit 1; }
          [[ "$fingerprint" =~ ^[A-Fa-f0-9]{40}$ ]] || { echo 'Invalid signing key fingerprint.' >&2; exit 1; }
          gpg --batch --with-colons --list-secret-keys "$fingerprint" \
            | awk -F: '($1 == "sec" || $1 == "ssb") && tolower($12) ~ /s/ { found = 1 } END { exit !found }' \
            || { echo 'The signing key has no signing-capable subkey.' >&2; exit 1; }
          printf '%s\n' "$fingerprint" > site/archive-keyring.fingerprint.txt
          gpg --batch --yes --armor --export "$fingerprint" > site/archive-keyring.asc
          gpg --batch --yes --export "$fingerprint" > site/archive-keyring.gpg
          for suite in stable stonking; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --local-user "$fingerprint" --armor --detach-sign \
              --output "site/dists/$suite/Release.gpg" "site/dists/$suite/Release"
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --local-user "$fingerprint" --clearsign \
              --output "site/dists/$suite/InRelease" "site/dists/$suite/Release"
            gpgv --keyring site/archive-keyring.gpg "site/dists/$suite/Release.gpg" "site/dists/$suite/Release"
            gpg --verify "site/dists/$suite/InRelease"
          done

      - name: Remove temporary GPG keyring
        if: always()
        env:
          GNUPGHOME: ${{ runner.temp }}/yousub-apt-gnupg
        run: |
          if [ -d "$GNUPGHOME" ]; then
            gpgconf --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi

      - if: steps.version.outputs.already != 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: steps.version.outputs.already != 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true
      - name: Deploy GitHub Pages
        if: steps.version.outputs.already != 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
