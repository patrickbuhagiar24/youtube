name: Test extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check JavaScript syntax
        run: |
          for file in background.js shared.js drive.js config-file.js diagnostics.js \
            content/content.js content/main-world.js popup/popup.js; do
            node --check "$file"
          done
      # jsdom, ESLint and TypeScript are development dependencies; the extension ships none of them.
      - name: Install development dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check the JavaScript
        run: npm run typecheck
      # The suite runs with coverage thresholds, so a drop in coverage fails the build too.
      - name: Run tests with coverage
        run: npm run coverage
