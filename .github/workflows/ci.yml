name: Test extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check JavaScript syntax
        run: |
          for file in background.js shared.js drive.js config-file.js diagnostics.js \
            content/content.js content/main-world.js popup/popup.js; do
            node --check "$file"
          done
      - name: Run tests
        run: node --test tests/*.test.cjs
